replicaCount: 2

image:
  repository: taskflow-stage
  backendRepository: taskflow-stage-backend
  frontendRepository: taskflow-stage-frontend
  tag: "preview"
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
# trigger
