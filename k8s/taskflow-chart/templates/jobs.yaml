apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-cleanup
  labels:
    app.kubernetes.io/name: cleanup
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: {{ .Values.jobs.cleanupSchedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: cleanup
            image: postgres:13-alpine # Maybe parametrize this if needed, but postgres:13-alpine is stable.
            command:
            - /bin/sh
            - -c
            - echo "Starting database cleanup..."; date; echo "Cleanup complete."
            env:
            - name: POSTGRES_HOST
              value: "postgres-service"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-creds
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-creds
                  key: password
