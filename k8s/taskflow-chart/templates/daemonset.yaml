apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-monitor
  labels:
    app.kubernetes.io/name: monitor
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: monitor
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitor
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      tolerations:
      # this toleration is to have the daemonset runnable on control plane nodes too
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: monitor
        image: busybox
        args:
        - /bin/sh
        - -c
        - >
          while true; do
            date;
            echo "Monitoring node health...";
            sleep 60;
          done
        resources:
          limits:
            memory: 200Mi
          requests:
            cpu: 10m
            memory: 50Mi
