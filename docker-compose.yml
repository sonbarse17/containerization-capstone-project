services:
  database:
    image: postgres:13-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: taskflow-api
    ports:
      - "5000:5000"
    environment:
      DB_HOST: database
      DB_NAME: taskdb
      DB_USER: postgres
      DB_PASS: password
    depends_on:
      database:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: taskflow-web
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: always

volumes:
  db_data:
