services:
  database:
    image: postgres:13-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_USER: taskflow_admin
      POSTGRES_PASSWORD: SecureTaskflowPassword123!
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U taskflow_admin" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-net

  backend:
    build: ./backend
    container_name: taskflow-api
    ports:
      - "5000:5000"
    environment:
      DB_HOST: database
      DB_NAME: taskdb
      DB_USER: taskflow_admin
      DB_PASS: SecureTaskflowPassword123!
    depends_on:
      database:
        condition: service_healthy
    restart: always
    networks:
      taskflow-net:
        aliases:
          - taskflow-backend

  frontend:
    build: ./frontend
    container_name: taskflow-web
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: always
    networks:
      - taskflow-net

networks:
  taskflow-net:
    driver: bridge

volumes:
  db_data:
